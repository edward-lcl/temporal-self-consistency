name: eval-pipeline-smoke-test

on:
  push:
    paths:
      - 'src/evaluation/**'
      - 'requirements.txt'
  pull_request:
    paths:
      - 'src/evaluation/**'

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib

      - name: Run eval pipeline smoke test
        run: |
          cd src/evaluation
          python eval_pipeline.py

      - name: Verify plots generate
        run: |
          cd src/evaluation
          python paper_plots.py
          test -f figures/ece_bar_chart.png

      - name: Verify results table generates
        run: |
          cd src/evaluation
          python generate_results_table.py
          test -f results_table.md
